  # ─── Projects Section ──────────────────────────────────────
  projects:
    enable: true
    items:
      - title: "Secure Infrastructure for company Codesecure"
        content: "Cesae Digital · 01/2026 – 03/2026 — Final project of the Network & Cybersecurity Administrator assessment. Segmented, secure infrastructure (defense-in-depth + ZTNA) for a simulated company with 120 hosted websites and 14 client VMs: VLANs/VLSM, DMZ, pfSense, Cloudflare ZTNA, Drupal SQLi pentest mapped to MITRE ATT&CK, risk assessment of 19 critical assets, Linux/AD hardening and Wazuh SIEM with active response."
        image: images/projects/profile.png
        badges:
          - "Packet Tracer"
          - "pfSense"
          - "Wazuh"
          - "Active Directory"
          - "Linux"
          - "Nessus"
          - "GRC"
          - "MITRE ATT&CK"
        links:
          - icon: fab fa-github
            url: "https://github.com/tbastosc/Network-Cybersecurity-Adminitrator-Assessment-Project"

      - title: "Threat Hunting - Sentinel & Defender XDR"
        content: "05/2026 – 08/2026 — Hands-on Azure lab built while preparing for the SC-200. Sentinel workspace and data connectors, analytics rules (including multistage attack detection), custom detections, watchlists, threat intelligence IOCs and hunting for MITRE ATT&CK techniques with KQL."
        image: images/kql.jpeg
        badges:
          - "Microsoft Sentinel"
          - "Azure Log Analytics"
          - "KQL"
          - "Defender XDR"
          - "MITRE ATT&CK"
        links:
          - icon: fab fa-github
            url: "https://github.com/tbastosc/sentinel-defender-xdr-threat-hunting"

      - title: "Security SOC Lab - Proxmox Server (WIP)"
        content: "05/2026 – Current — Self-hosted Proxmox environment split into a cybersecurity lab and a personal cloud (Jellyfin, Immich, backups). Used to practice alert triage, investigation, containment and remediation, with blue team tooling (Security Onion, Wazuh, Suricata/Zeek, TheHive/Cortex, MISP) and red team practice (Kali, Metasploit, Caldera, VulnHub, AD attack/defense)."
        image: images/soclab1.jpeg
        badges:
          - "Proxmox"
          - "pfSense"
          - "Twingate"
          - "Cloudflare ZT"
          - "Security Onion"
          - "Wazuh"
          - "TheHive"
          - "MISP"
          - "Docker"
        links:
          - icon: fab fa-github
            url: "https://github.com/tbastosc/proxmox-homelab"
          - icon: fas fa-book
            url: "https://github.com/tbastosc/proxmox-homelab/tree/main/docs"

      - title: "Goku-Invaders - Python Game"
        content: "Dec 2024 – Feb 2025 — Team final project of a Python programming course: a modified Space Invaders where Goku moves vertically and shoots enemy waves to save Kika. Level progression, story sequences between levels and a scoring system."
        image: images/gokuinvaders.jpg
        badges:
          - "Python"
          - "Pygame"
        links:
          - icon: fab fa-github
            url: "https://github.com/tbastosc/Goku-Invaders"

